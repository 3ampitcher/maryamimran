name: Qahwa

# Qahwa is a desktop app, so this is where its builds are actually proven —
# and where the installers come from if you would rather not set up a Rust
# toolchain. The Rust tests run here too: they need a real Windows or macOS
# target to link against.
on:
  push:
    paths:
      - 'qahwa/**'
      - '.github/workflows/qahwa.yml'
  pull_request:
    paths:
      - 'qahwa/**'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Replace the public download page with this build'
        type: boolean
        default: false

# A release build with LTO is slow. If a newer commit lands on the same branch,
# the older build is answering a question nobody is asking any more.
concurrency:
  group: qahwa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # to publish the downloadable release at the end
    defaults:
      run:
        working-directory: qahwa

    strategy:
      # One platform failing should not hide whether the other one works.
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            bundles: nsis
            artifact: qahwa-windows-installer
            paths: |
              qahwa/src-tauri/target/release/bundle/nsis/*.exe
              qahwa/src-tauri/target/release/qahwa.exe
          - name: macOS
            os: macos-latest
            bundles: app,dmg
            artifact: qahwa-macos
            paths: |
              qahwa/src-tauri/target/release/bundle/dmg/*.dmg

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: qahwa/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: qahwa/src-tauri
          key: ${{ matrix.os }}

      - run: npm ci

      - name: Typecheck and build the frontend
        run: npm run build

      - name: Test the gesture the app exists for
        # No --with-deps: it only installs Linux system packages, and neither
        # runner here is Linux. On Windows it is an error, not a no-op.
        run: |
          npx playwright install chromium
          npm run test:ui

      - name: Test the recipe store and window geometry
        working-directory: qahwa/src-tauri
        run: cargo test

      - name: Build the app
        run: npm run tauri -- build --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error

      # Deliberately manual, and Windows only for now. The public release is
      # what testers have installed, so it is replaced only when someone asks
      # for it by name — never as a side effect of a push.
      - name: Publish the downloadable release
        if: matrix.os == 'windows-latest' && github.event_name == 'workflow_dispatch' && inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cp src-tauri/target/release/qahwa.exe src-tauri/target/release/Qahwa-portable.exe
          gh release delete qahwa-latest --yes --cleanup-tag || true
          gh release create qahwa-latest \
            --title "Qahwa - test build" \
            --notes-file ../.github/qahwa-release-notes.md \
            --prerelease \
            --target "$GITHUB_SHA" \
            src-tauri/target/release/bundle/nsis/*.exe \
            src-tauri/target/release/Qahwa-portable.exe
