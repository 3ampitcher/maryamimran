name: Rebrew

# Rebrew is a desktop app, so this is where its builds are actually proven —
# and where the installers come from if you would rather not set up a Rust
# toolchain. The Rust tests run here too: they need a real Windows or macOS
# target to link against.
on:
  push:
    paths:
      - 'rebrew/**'
      - '.github/workflows/rebrew.yml'
  pull_request:
    paths:
      - 'rebrew/**'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Replace the public download page with this build'
        type: boolean
        default: false

# A release build with LTO is slow. If a newer commit lands on the same branch,
# the older build is answering a question nobody is asking any more.
concurrency:
  group: rebrew-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # to publish the downloadable release at the end
    defaults:
      run:
        working-directory: rebrew

    strategy:
      # One platform failing should not hide whether the other one works.
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            bundles: nsis
            artifact: rebrew-windows-installer
            paths: |
              rebrew/src-tauri/target/release/bundle/nsis/*.exe
              rebrew/src-tauri/target/release/rebrew.exe
          - name: macOS
            os: macos-latest
            bundles: app,dmg
            artifact: rebrew-macos
            paths: |
              rebrew/src-tauri/target/release/bundle/dmg/*.dmg

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: rebrew/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: rebrew/src-tauri
          key: ${{ matrix.os }}

      - run: npm ci

      - name: Typecheck and build the frontend
        run: npm run build

      - name: Test the gesture the app exists for
        # No --with-deps: it only installs Linux system packages, and neither
        # runner here is Linux. On Windows it is an error, not a no-op.
        run: |
          npx playwright install chromium
          npm run test:ui

      - name: Test the recipe store and window geometry
        working-directory: rebrew/src-tauri
        run: cargo test

      - name: Build the app
        run: npm run tauri -- build --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error

      # Deliberately explicit, and Windows only for now. The public release is
      # what testers have installed, so it is replaced only when a commit asks
      # for it by name — never as a side effect of ordinary work.
      #
      # Two ways to ask, because not every context has both: run the workflow
      # by hand and tick the box, or put [publish] in the commit message. A
      # tag would be the conventional third, but a tag push is refused here.
      - name: Publish the downloadable release
        if: >-
          matrix.os == 'windows-latest' &&
          ((github.event_name == 'workflow_dispatch' && inputs.publish_release) ||
           contains(github.event.head_commit.message, '[publish]'))
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cp src-tauri/target/release/rebrew.exe src-tauri/target/release/Rebrew-portable.exe
          gh release delete rebrew-latest --yes --cleanup-tag || true
          gh release create rebrew-latest \
            --title "Rebrew - test build" \
            --notes-file ../.github/rebrew-release-notes.md \
            --prerelease \
            --target "$GITHUB_SHA" \
            src-tauri/target/release/bundle/nsis/*.exe \
            src-tauri/target/release/Rebrew-portable.exe
