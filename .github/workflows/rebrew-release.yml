name: Rebrew release

# Publishing is a deliberate act, so it has its own trigger: pushing a version
# tag, and nothing else. Ordinary commits build and upload an artifact via
# rebrew.yml; only a tag replaces what the public download page serves.
#
# This is separate from the build workflow because a `paths` filter and a tag
# push do not coexist — a tag points at an existing commit, so there are no
# changed paths for the filter to match and the job would never start.
on:
  push:
    tags:
      - 'rebrew-v*'

concurrency:
  group: rebrew-release
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish
    runs-on: windows-latest
    permissions:
      contents: write # to create the release and upload the installer
    defaults:
      run:
        working-directory: rebrew

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: rebrew/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: rebrew/src-tauri
          key: windows-latest

      - run: npm ci

      - name: Typecheck and build the frontend
        run: npm run build

      # A release that skips its own tests is how a bad build reaches someone
      # else's machine.
      - name: Test the gesture the app exists for
        run: |
          npx playwright install chromium
          npm run test:ui

      - name: Test the recipe store and window geometry
        working-directory: rebrew/src-tauri
        run: cargo test

      - name: Build the app and the installer
        run: npm run tauri -- build --bundles nsis

      - name: Publish the downloadable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cp src-tauri/target/release/rebrew.exe src-tauri/target/release/Rebrew-portable.exe
          # The tag people share is fixed, so the link never changes as builds
          # replace what sits behind it.
          gh release delete rebrew-latest --yes --cleanup-tag || true
          gh release create rebrew-latest \
            --title "Rebrew - test build" \
            --notes-file ../.github/rebrew-release-notes.md \
            --prerelease \
            --target "$GITHUB_SHA" \
            src-tauri/target/release/bundle/nsis/*.exe \
            src-tauri/target/release/Rebrew-portable.exe

      - uses: actions/upload-artifact@v4
        with:
          name: rebrew-windows-installer
          path: |
            rebrew/src-tauri/target/release/bundle/nsis/*.exe
            rebrew/src-tauri/target/release/rebrew.exe
          if-no-files-found: error
