name: Qahwa (Windows)

# Qahwa is a Windows-first desktop app, so this is where its build is actually
# proven — and where the installer comes from if you would rather not set up a
# Rust toolchain.
on:
  push:
    paths:
      - 'qahwa/**'
      - '.github/workflows/qahwa-windows.yml'
  pull_request:
    paths:
      - 'qahwa/**'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Replace the public download page with this build'
        type: boolean
        default: false

# A Windows release build with LTO is slow. If a newer commit lands on the same
# branch, the older build is answering a question nobody is asking any more.
concurrency:
  group: qahwa-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # to publish the downloadable release at the end
    defaults:
      run:
        working-directory: qahwa

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: qahwa/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: qahwa/src-tauri

      - run: npm ci

      - name: Typecheck and build the frontend
        run: npm run build

      - name: Build the app and the installer
        run: npm run app:build

      - uses: actions/upload-artifact@v4
        with:
          name: qahwa-windows-installer
          path: |
            qahwa/src-tauri/target/release/bundle/nsis/*.exe
            qahwa/src-tauri/target/release/qahwa.exe
          if-no-files-found: error

      # The artifact above needs a GitHub login to download, which is no use for
      # handing the app to someone to test. A release is a plain public download
      # page. The tag is fixed, so the link stays the same as builds replace it.
      # Deliberately manual. The public release is what testers have installed,
      # so it is replaced only when someone asks for it by name — never as a
      # side effect of a push.
      - name: Publish the downloadable release
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cp src-tauri/target/release/qahwa.exe src-tauri/target/release/Qahwa-portable.exe
          gh release delete qahwa-latest --yes --cleanup-tag || true
          gh release create qahwa-latest \
            --title "Qahwa - test build" \
            --notes-file ../.github/qahwa-release-notes.md \
            --prerelease \
            --target "$GITHUB_SHA" \
            src-tauri/target/release/bundle/nsis/*.exe \
            src-tauri/target/release/Qahwa-portable.exe
