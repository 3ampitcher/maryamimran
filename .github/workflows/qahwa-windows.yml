name: Qahwa (Windows)

# Qahwa is a Windows-first desktop app, so this is where its build is actually
# proven — and where the installer comes from if you would rather not set up a
# Rust toolchain.
on:
  push:
    paths:
      - 'qahwa/**'
      - '.github/workflows/qahwa-windows.yml'
  pull_request:
    paths:
      - 'qahwa/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: qahwa

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: qahwa/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: qahwa/src-tauri

      - run: npm ci

      - name: Typecheck and build the frontend
        run: npm run build

      - name: Build the app and the installer
        run: npm run app:build

      - uses: actions/upload-artifact@v4
        with:
          name: qahwa-windows-installer
          path: |
            qahwa/src-tauri/target/release/bundle/nsis/*.exe
            qahwa/src-tauri/target/release/qahwa.exe
          if-no-files-found: error
